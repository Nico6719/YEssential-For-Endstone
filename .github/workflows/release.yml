name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # main push / tag push: 自动构建；workflow_dispatch: 手动触发
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 << 'PYEOF'
          import os
          p = os.path.join('src', 'endstone_yessential', 'constant.py')
          v = '0.0.0'
          for line in open(p, encoding='utf-8'):
              if line.startswith('plugin_version'):
                  v = line.split('=')[1].strip().strip('"').strip("'")
                  break
          print(v)
          PYEOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        shell: bash
        run: |
          git fetch --tags --force
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build wheel
        if: github.event_name != 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        run: python -m build --wheel

      # ────────────────────────────────────
      # 生成 Release 说明
      # ────────────────────────────────────
      - name: Extract release notes
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"

          # 1. 从 CHANGELOG.md 提取当前版本的分类总结
          SUMMARY=""
          if [ -f CHANGELOG.md ]; then
            SUMMARY=$(awk -v ver="${VERSION}" '
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]")) { found=1; next }
              }
              found {
                if (/^## \[/ || /^---$/) exit
                print
              }
            ' CHANGELOG.md 2>/dev/null || true)
          fi
          SUMMARY="${SUMMARY:-## YEssential v${VERSION}}"

          # 2. 获取上一版本 tag，API 拉取提交和贡献者
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "v${VERSION}" | head -n1)

          if [ -n "$PREV_TAG" ]; then
            RESPONSE=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" 2>/dev/null || echo "{}")

            DETAILS=$(echo "$RESPONSE" | jq -r '
              [.commits[]? | select(.author.login != "github-actions[bot]")] |
              map("- \(.commit.message | split("\n")[0]) (@\(.author.login))") |
              join("\n")
            ' 2>/dev/null || echo "")

            AUTHORS=$(echo "$RESPONSE" | jq -r '
              [.commits[]?.author.login // empty] |
              unique |
              map(select(. != "github-actions[bot]")) |
              map("@" + .) |
              join(" ")
            ' 2>/dev/null || echo "")
          else
            DETAILS=""
            AUTHORS=""
          fi

          # 3. 组装 Release Body
          {
            printf '%s\n' "$SUMMARY"
            if [ -n "$PREV_TAG" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' \
                "${{ github.repository }}" "$PREV_TAG" "$VERSION"
            fi
            if [ -n "$DETAILS" ]; then
              printf '\n%s\n' "$DETAILS"
            fi
            if [ -n "$AUTHORS" ]; then
              printf '\n**Contributors**: %s\n' "$AUTHORS"
            fi
          } > /tmp/release_body.md

          printf 'BODY<<BODYEOF\n' >> "$GITHUB_OUTPUT"
          cat /tmp/release_body.md >> "$GITHUB_OUTPUT"
          printf '\nBODYEOF\n' >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────
      # 创建 Tag（main push / workflow_dispatch）
      # ────────────────────────────────────
      - name: Create tag (main push / workflow_dispatch)
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          PRERELEASE="false"
          case "$TAG" in *beta*|*alpha*|*rc*|*dev*) PRERELEASE="true" ;; esac

          gh release create "$TAG" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release_body.md \
            --prerelease=$PRERELEASE \
            dist/*.whl
