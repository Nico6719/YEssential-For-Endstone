name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # main push / tag push: 自动构建；workflow_dispatch: 手动触发
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 << 'PYEOF'
          import os
          p = os.path.join('src', 'endstone_yessential', 'constant.py')
          v = '0.0.0'
          for line in open(p, encoding='utf-8'):
              if line.startswith('plugin_version'):
                  v = line.split('=')[1].strip().strip('"').strip("'")
                  break
          print(v)
          PYEOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        shell: bash
        run: |
          git fetch --tags --force
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      # ────────────────────────────────────
      # 1. 先生成 CHANGELOG（在构建之前）
      # ────────────────────────────────────
      - name: Generate changelog with git-cliff
        if: github.event_name != 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output /tmp/changelog.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit CHANGELOG & sync to dev
        if: github.event_name != 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          if [ ! -s /tmp/changelog.md ]; then
            echo "git-cliff produced empty output, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 拼接新内容到 CHANGELOG.md 头部
          if [ -f CHANGELOG.md ]; then
            cat /tmp/changelog.md CHANGELOG.md > /tmp/new_changelog.md
            mv /tmp/new_changelog.md CHANGELOG.md
          else
            cp /tmp/changelog.md CHANGELOG.md
          fi

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No CHANGELOG changes"
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          git commit -m "chore: update CHANGELOG for v${VERSION} [skip ci]"

          # 推送到 main
          git push origin HEAD:main

          # 同步到 dev
          git fetch origin dev
          git checkout -b sync-changelog origin/dev
          git checkout main -- CHANGELOG.md
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync CHANGELOG from main [skip ci]"
            git push origin HEAD:dev || echo "⚠️ Push to dev failed, will sync on next PR"
          else
            echo "dev CHANGELOG already up to date"
          fi

      # ────────────────────────────────────
      # 2. 构建 wheel
      # ────────────────────────────────────
      - name: Build wheel
        if: github.event_name != 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        run: python -m build --wheel

      # ────────────────────────────────────
      # 3. 生成 Release 说明
      # ────────────────────────────────────
      - name: Extract release notes
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"

          # 获取上一版本 tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "v${VERSION}" | head -n1)

          # 贡献者
          if [ -n "$PREV_TAG" ]; then
            RESPONSE=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...HEAD" 2>/dev/null || echo "{}")
            AUTHORS=$(echo "$RESPONSE" | jq -r '
              [.commits[]?.author.login // empty] |
              unique |
              map(select(. != "github-actions[bot]")) |
              map("@" + .) |
              join(" ")
            ' 2>/dev/null || echo "")
          else
            AUTHORS=""
          fi

          # 组装 Release Body：以 git-cliff 分类 CHANGELOG 为主体
          {
            if [ -s /tmp/changelog.md ]; then
              cat /tmp/changelog.md
            else
              printf '## YEssential v%s\n\n' "$VERSION"
            fi
            if [ -n "$PREV_TAG" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' \
                "${{ github.repository }}" "$PREV_TAG" "$VERSION"
            fi
            if [ -n "$AUTHORS" ]; then
              printf '\n**Contributors**: %s\n' "$AUTHORS"
            fi
          } > /tmp/release_body.md

          printf 'BODY<<BODYEOF\n' >> "$GITHUB_OUTPUT"
          cat /tmp/release_body.md >> "$GITHUB_OUTPUT"
          printf '\nBODYEOF\n' >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────
      # 4. 创建 Tag（main push / workflow_dispatch）
      # ────────────────────────────────────
      - name: Create tag (main push / workflow_dispatch)
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      # ────────────────────────────────────
      # 5. 发布 Release
      # ────────────────────────────────────
      - name: Create GitHub Release
        if: github.event_name != 'workflow_dispatch' || steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          PRERELEASE="false"
          case "$TAG" in *beta*|*alpha*|*rc*|*dev*) PRERELEASE="true" ;; esac

          gh release create "$TAG" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release_body.md \
            --prerelease=$PRERELEASE \
            dist/*.whl
