name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────
  # Python 语法检查 + Wheel 构建验证
  # ──────────────────────────────────────────
  lint-and-build:
    name: Lint & Build Check
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install build ruff

      - name: Ruff lint
        run: ruff check src/ --output-format=github || true

      - name: Python syntax check
        run: python -m compileall src/

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel exists
        shell: bash
        run: |
          if ls dist/*.whl 1>/dev/null 2>&1; then
            echo "✅ Wheel built successfully"
            ls -la dist/
          else
            echo "❌ No wheel found"
            exit 1
          fi

  # ──────────────────────────────────────────
  # CHANGELOG 一致性检查
  # ──────────────────────────────────────────
  changelog-check:
    name: CHANGELOG Check
    timeout-minutes: 2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check CHANGELOG has version entry
        shell: bash
        run: |
          # 提取当前源码版本号
          VERSION=$(python3 << 'PYEOF'
          import os
          p = os.path.join('src', 'endstone_yessential', 'constant.py')
          v = '0.0.0'
          for line in open(p, encoding='utf-8'):
              if line.startswith('plugin_version'):
                  v = line.split('=')[1].strip().strip('"').strip("'")
                  break
          print(v)
          PYEOF
          )

          echo "Source version: $VERSION"

          # 检查 CHANGELOG.md 是否存在
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md 不存在!"
            exit 1
          fi

          # 检查 CHANGELOG.md 是否包含当前版本号
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "✅ CHANGELOG.md 包含版本 [$VERSION] 的记录"
          else
            echo "❌ CHANGELOG.md 中未找到版本 [$VERSION] 的记录"
            echo ""
            echo "请在 CHANGELOG.md 中添加:"
            echo "  ## [$VERSION] - $(date +%Y-%m-%d)"
            echo ""
            echo "当前 CHANGELOG.md 中的版本条目:"
            grep "^## \[" CHANGELOG.md || echo "  (无)"
            exit 1
          fi
