name: Update Changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update-changelog:
    name: Generate & Commit CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output /tmp/changelog.md

      - name: Commit & Push CHANGELOG
        shell: bash
        run: |
          if [ ! -s /tmp/changelog.md ]; then
            echo "git-cliff produced empty output, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 把新内容拼接到 CHANGELOG.md 头部
          if [ -f CHANGELOG.md ]; then
            cat /tmp/changelog.md CHANGELOG.md > /tmp/new_changelog.md
            mv /tmp/new_changelog.md CHANGELOG.md
          else
            cp /tmp/changelog.md CHANGELOG.md
          fi

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No CHANGELOG changes"
            exit 0
          fi

          # 获取版本号
          TAG="${GITHUB_REF#refs/tags/}"
          git commit -m "chore: update CHANGELOG for ${TAG} [skip ci]"

          # 推送到 main
          git push origin HEAD:main

          # 同步到 dev
          git fetch origin dev
          git checkout -b sync-changelog origin/dev
          git checkout main -- CHANGELOG.md
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync CHANGELOG from main [skip ci]"
            git push origin HEAD:dev || echo "⚠️ Push to dev failed, will sync on next PR"
          else
            echo "dev CHANGELOG already up to date"
          fi
